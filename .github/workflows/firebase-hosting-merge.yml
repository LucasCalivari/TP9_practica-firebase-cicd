# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

# TODO A1: Cambiá el trigger para que corra en cada push a la rama `main`.
on:
  workflow_dispatch: # se mantiene para poder lanzar el deploy a mano desde la pestaña Actions
  push: # A1: el workflow se dispara cuando alguien hace push
    branches:
      - main # A1: solo si el push es a main (es decir, al mergear un PR)

permissions:
  contents: read

# TODO A4 (opcional): en producción NO queremos cancelar un deploy a mitad de
#                     camino, pero sí evitar dos deploys en paralelo.
#                     ¿Cómo configurás `concurrency` para eso?

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # TODO A5 (opcional): asociá este job a un GitHub Environment llamado
    #                     `production` (permite exigir aprobación manual).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # TODO A2: igual que en el workflow de PR, pero con los datos del push a main.
      #          Pistas: github.sha, github.ref_name
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }} # A2: hash del commit de main que se está desplegando (se ve en el footer)
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }} # A2: nombre de la rama (acá siempre "main")
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # TODO A3: mismo secreto que en el workflow de PR.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_FIREBASE_CICD_LUCAS }}
          projectId: practica-firebase-cicd-lucas
          # TODO A3: ¿qué valor de channelId publica en producción?
          channelId: live # A3: "live" es el canal de producción; cualquier otro valor crearía un preview
