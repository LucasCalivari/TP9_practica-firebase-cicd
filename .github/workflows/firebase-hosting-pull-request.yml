# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
#  Mientras el trigger sea solo `workflow_dispatch`, el workflow NO corre solo.
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# TODO A1: Cambiá el trigger para que este workflow corra en cada Pull Request.
on:
  workflow_dispatch: # se mantiene para poder lanzar el preview a mano desde la pestaña Actions
  pull_request: # A1: el workflow se dispara por eventos de Pull Request (abrir, pushear commits nuevos, reabrir)

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

# TODO A4 (opcional): agregá un bloque `concurrency` para que, si se pushea dos
#                     veces seguidas al mismo PR, se cancele el build anterior.

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # TODO A2: Completá las variables de entorno del build con los datos del
      #          commit, para que el footer muestre qué versión está desplegada.
      #          Pistas: github.event.pull_request.head.sha, github.head_ref
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }} # A2: SHA del último commit de la rama del PR (no el del merge temporal, que es github.sha)
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }} # A2: nombre de la rama origen del PR (se ve en el footer)
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      - name: Deploy a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # TODO A3: Reemplazá el nombre del secreto por el que creó
          #          `firebase init hosting:github` en tu repo
          #          (Settings → Secrets and variables → Actions).
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_FIREBASE_CICD_LUCAS }}
          projectId: practica-firebase-cicd-lucas
          # TODO A3: Definí cuánto tiempo vive el preview (ej. 3d). ¿Por qué no conviene que viva para siempre?
          expires: 3d # A3: el canal de preview se borra solo a los 3 días, para no acumular URLs viejas con código sin revisar
